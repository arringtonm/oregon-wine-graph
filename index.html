<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- A glass of claret on a dark tile: SVG where supported, a PNG elsewhere, and a square
         version for phone home screens (which round the corners themselves). Browsers keep icons
         in their own cache, so bump ?v= when the icon changes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <meta name="theme-color" content="#f8f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140e10" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oregon Wine Graph</title>
    <!-- A theme the reader chose (services/theme.ts), applied before the first paint -->
    <script>
      try {
        const theme = localStorage.getItem('oregon-wine-graph:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
