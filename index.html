<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Oregon behind a glass of claret, as in the header: SVG where supported (its glass
         follows the browser's light or dark theme), a PNG elsewhere, and a version on the dark
         page colour for phone home screens. Browsers keep icons in their own cache, so bump ?v=
         when the icon changes. Each record's page (tools/seo/prerender.ts) adds its own title,
         description and share tags after <title> -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <meta name="theme-color" content="#f8f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#140e10" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oregon Wine Graph</title>
    <!-- A theme the reader chose (services/theme.ts), applied before the first paint -->
    <script>
      try {
        const theme = localStorage.getItem('oregon-wine-graph:theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
